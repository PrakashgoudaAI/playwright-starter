name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser coverage (API checks are always included)
        type: choice
        default: all
        options: [all, chromium, firefox, webkit]
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/browser-tests.yml
    with:
      browser: ${{ inputs.browser || 'all' }}
